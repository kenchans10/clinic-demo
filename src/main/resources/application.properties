spring.application.name=clinic
spring.datasource.url=jdbc:mysql://localhost:3306/devbe?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=devbe
spring.datasource.password=devbe
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#liquibase
spring.liquibase.change-log=classpath:/db/changelog/master.xml
spring.liquibase.enabled=true

management.endpoints.web.exposure.include=health,info,metrics,mappings
